name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # === Authentication ===
          # Classic PAT (ghp_*) with: repo, read:user, read:org
          # Add as repository secret: METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: MAdityaRao
          filename: github-metrics.svg

          # === Base Configuration ===
          base: header, activity, community, repositories

          config_order: >-
            header, isocalendar, languages, notable, topics,
            followup, lines, stars, community, repositories

          config_timezone: Asia/Kolkata
          config_display: large
          config_gemoji: no
          config_base64: yes

          # === Terracotta / Charcoal Theme ===
          # Scoped to specific classes to avoid painting over heatmap cells
          extras_css: |
            .items-wrapper {
              background-color: #17130F;
              color: #A8A29E;
              padding: 22px 28px;
              border-radius: 16px;
            }

            h1, h2, h3, .title, [class*="title"] {
              color: #D97757 !important;
              letter-spacing: 0.02em;
            }
            h1 svg, h2 svg, h3 svg { fill: #D97757 !important; }

            .field, .repository .infos, .activity .details,
            .field.language.details small, .field.license.details small {
              color: #A8A29E;
            }
            .repository .description { color: #7C7670; }

            .repository .name span:first-child,
            .activity .issue {
              color: #D97757 !important;
            }
            .repository .name span:last-child { color: #6B6560; }

            .field > svg, .octicon {
              fill: #D97757 !important;
            }

            .contribution.organization, .topic {
              border: 1px solid #D9775555 !important;
              background-color: #D9775514 !important;
              color: #D97757 !important;
              border-radius: 999px !important;
            }

            :root {
              --color-calendar-graph-day-bg: #201A15;
              --color-calendar-graph-day-border: #D9775722;
              --color-calendar-graph-day-L1-bg: #3E2A1E;
              --color-calendar-graph-day-L2-bg: #6B4530;
              --color-calendar-graph-day-L3-bg: #B05F3D;
              --color-calendar-graph-day-L4-bg: #D97757;
            }
            svg.calendar text, .isocalendar text { fill: #A8A29E; }

            .field.error, .field.error svg {
              color: #E5484D !important;
              fill: #E5484D !important;
            }

          # === Plugins ===
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_colors: 0:#D97757, 1:#C0673F, 2:#A6572F, 3:#8C471F, default:#4A443E

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public

          plugin_notable: yes
          plugin_notable_from: repositories
          plugin_notable_filter: stars>0

          plugin_lines: yes

          plugin_stars: yes
          plugin_stars_limit: 6

          plugin_followup: yes
          plugin_followup_sections: pr, issue

      - name: Commit and push metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update github metrics [skip ci]"
            git push
          fi