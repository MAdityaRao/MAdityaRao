name: Metrics
on:
  # Refresh once per day
  schedule:
    - cron: "0 3 * * *"
  # Also allow manual trigger from the Actions tab
  workflow_dispatch:
  # Refresh on push to main so it's up to date right after you commit
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # === Auth ===
          # MUST be a CLASSIC personal access token (starts with ghp_), added as a
          # REPOSITORY secret (Settings -> Secrets and variables -> Actions -> Secrets
          # tab -> "New repository secret"), not an Environment secret, and not a
          # fine-grained token (those aren't supported by this action at all).
          # See SETUP_INSTRUCTIONS.md.
          token: ${{ secrets.METRICS_TOKEN }}
          user: MAdityaRao
          filename: github-metrics.svg

          # === Base panel ===
          base: header, activity, community, repositories

          config_timezone: Asia/Kolkata
          config_display: large
          config_gemoji: img
          config_base64: yes

          # === Gold / white theme ===
          # Theming this action isn't done through config_theme_* flags (those don't
          # exist) — it's done by injecting raw CSS that overrides the template's
          # colors. This repaints the default dark template in amber/white to match
          # the portfolio's accent.
          extras_css: |
            :root {
              --color-content-default: #F2F2F2 !important;
              --color-fill-default: #F5A623 !important;
              --color-fill-alt: #F5A623 !important;
              --color-border-default: #F5A62355 !important;
            }
            svg, .metrics-container-bg {
              fill: #0D1117 !important;
            }
            text, tspan {
              fill: #F2F2F2 !important;
            }
            text.large, h1, h2, h3, .title,
            [class*="title"], [class*="header"] {
              fill: #F5A623 !important;
              color: #F5A623 !important;
            }
            rect, path, circle, polygon {
              stroke: #F5A62355;
            }
            .octicon, svg[class*="icon"] {
              fill: #F5A623 !important;
            }

          # === Plugins (mirrors the reference: calendar, languages, activity, topics) ===
          plugin_calendar: yes
          plugin_calendar_limit: 1

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public

          plugin_notable: yes
          plugin_notable_from: repositories
          plugin_notable_filter: stars>0

          plugin_lines: yes

          plugin_stars: yes
          plugin_stars_limit: 0

          plugin_followup: yes
          plugin_followup_sections: pr, issue

          plugin_projects: yes
