name: Metrics
on:
  # Refresh once per day
  schedule:
    - cron: "0 3 * * *"
  # Also allow manual trigger from the Actions tab
  workflow_dispatch:
  # Refresh on push to main so it's up to date right after you commit
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # === Auth ===
          # Uses the default token — no extra secret needed for public data.
          # For private repos / extra plugins you can swap in a PAT stored as METRICS_TOKEN.
          token: ${{ secrets.GITHUB_TOKEN }}
          user: MAdityaRao
          filename: github-metrics.svg

          # === Base panel ===
          base: header, activity, community, repositories, metadata

          # === Gold / white theme (matches the amber portfolio accent) ===
          config_timezone: Asia/Kolkata
          config_display: large
          config_theme: dark
          config_gemoji: img
          config_base64: yes

          # Custom palette override: amber gold on near-black, white text
          config_theme_dark_background: 0D1117
          config_theme_dark_border: F5A62333
          config_theme_dark_color: F5A623
          config_theme_dark_text: F2F2F2
          config_theme_dark_icon: F5A623

          # === Plugins (mirrors the reference: calendar, languages, activity, topics) ===
          plugin_calendar: yes
          plugin_calendar_limit: 1

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public

          plugin_notable: yes
          plugin_notable_from: repositories
          plugin_notable_filter: stars>0

          plugin_lines: yes

          plugin_stars: yes
          plugin_stars_limit: 0

          plugin_followup: yes
          plugin_followup_sections: pr, issue

          plugin_projects: yes